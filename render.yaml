services:
  - type: web
    name: fastatoms
    env: python
    plan: free
    rootDir: app/backend
    buildCommand: |
      pip install -r requirements.txt
      cd ../frontend && npm install && npm run build
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:////var/data/fastatoms.db
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: FRONTEND_DIST
        value: ../frontend/dist
      - key: ENVIRONMENT
        value: prod
